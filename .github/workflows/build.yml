name: Build Resume

on:
  push:
    branches:
      - master
    paths:
      - 'resume.tex'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex

      - uses: actions/upload-artifact@v7
        with:
          name: resume-pdf
          path: resume.pdf
          archive: false
